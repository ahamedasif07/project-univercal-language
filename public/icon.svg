<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ulBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061e47"/>
      <stop offset="45%" stop-color="#0b3a82"/>
      <stop offset="100%" stop-color="#1d5ec9"/>
    </linearGradient>
    <linearGradient id="ulArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ulGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Deep Royal Squircle Frame -->
  <rect width="512" height="512" rx="120" fill="url(#ulBg)"/>
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.18"/>

  <!-- Stylized "U" Monogram -->
  <path d="M 148 135 L 148 275 C 148 345 195 390 256 390 C 317 390 364 345 364 275 L 364 135" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="50" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Orbital Global Arc (Universal Connectivity) -->
  <ellipse cx="256" cy="275" rx="172" ry="62" 
           fill="none" 
           stroke="url(#ulArc)" 
           stroke-width="26" 
           transform="rotate(-24 256 275)" 
           stroke-dasharray="230 110"
           stroke-linecap="round"/>

  <!-- Academic Star of Excellence -->
  <circle cx="364" cy="135" r="18" fill="url(#ulGold)"/>
</svg>
